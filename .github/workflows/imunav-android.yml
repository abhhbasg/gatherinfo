name: ImuNav Android

on:
  push:
    paths: ["ImuNav/**", ".github/workflows/imunav-android.yml"]
  pull_request:
    paths: ["ImuNav/**", ".github/workflows/imunav-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ImuNav
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Fusion unit tests
        run: ./gradlew :fusion:test
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: imunav-apk
          path: |
            ImuNav/app/build/outputs/apk/debug/app-debug.apk
            ImuNav/app/build/outputs/apk/release/app-release.apk
