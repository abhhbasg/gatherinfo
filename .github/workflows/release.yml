name: Release
# Push a tag like v0.2.0 to build and publish the APK. Needs the repository secrets
# KEYSTORE_BASE64 (the keystore file in base64), KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > keystore.properties
      - run: ./gradlew testDebugUnitTest assembleRelease
      - name: Name and checksum
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/MetroWinKeyboard-${GITHUB_REF_NAME#v}.apk"
          (cd out && sha256sum *.apk > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
